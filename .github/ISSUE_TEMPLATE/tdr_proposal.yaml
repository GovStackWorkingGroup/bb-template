name: Technical Decision Record (TDR)
description: Propose a technical decision that is local to this Building Block's specification
title: "[<name>][TDR]: "
labels: ["TDR", "bb-<name>"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for decisions that only affect this Building Block: its requirements, APIs, data model, workflows, or internal structure.

        If the decision affects other Building Blocks or GovStack architecture as a whole, use the **Architecture Decision Record (ADR)** template instead.
  - type: checkboxes
    id: opening-questions
    attributes:
      label: Opening questions
      options:
        - label: I have checked the [current list of issues](../issues) and the existing decision records and confirm this has not already been proposed
          required: true
        - label: I agree to follow the [GovStack Code of Conduct](https://govstack.global/coc)
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Area of the specification
      multiple: true
      options:
        - Functional requirements
        - Cross-functional requirements
        - API / service interfaces
        - Data structures
        - Internal workflows
        - Other
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Location in the specification
      description: Link or path to the section(s) this decision would change, if any.
      placeholder: e.g. requirements/functionality-name.md
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What problem or situation calls for this decision?
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Proposed decision
      description: What do you propose to change, and how?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other options were evaluated, and why were they not chosen?
  - type: textarea
    id: consequences
    attributes:
      label: Consequences
      description: What becomes easier or harder as a result? Note trade-offs and follow-up work.
    validations:
      required: true
  - type: dropdown
    id: breaking
    attributes:
      label: Is this a breaking change for existing implementations?
      options:
        - "No"
        - "Yes"
        - Unsure
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Links to related issues, ADRs, TDRs, discussions, or standards.
